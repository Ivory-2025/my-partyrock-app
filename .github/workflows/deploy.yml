name: Deploy SmartMed Cycle

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: SAM Build → Deploy → S3 Sync
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      # ── 1. Checkout ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. AWS credentials ───────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ap-southeast-5

      # ── 3. Python 3.12 ───────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── 4. AWS SAM CLI ───────────────────────────────────
      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      # ── 5. SAM Build ─────────────────────────────────────
      - name: SAM Build
        run: sam build --template infra/template.yaml

      # ── 6. SAM Deploy ────────────────────────────────────
      - name: SAM Deploy
        run: |
          sam deploy \
            --stack-name smartmed-cycle \
            --s3-bucket ${{ secrets.SAM_DEPLOY_BUCKET }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --region ap-southeast-5 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      # ── 7. Read CloudFormation outputs ───────────────────
      - name: Read stack outputs
        id: outputs
        run: |
          get_output() {
            aws cloudformation describe-stacks \
              --stack-name smartmed-cycle \
              --region ap-southeast-5 \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }

          echo "EXTRACT_URL=$(get_output ExtractfromPhotoUrl)"         >> $GITHUB_OUTPUT
          echo "MEDICINE_CARD_URL=$(get_output MedicineCardUrl)"       >> $GITHUB_OUTPUT
          echo "SUMMARY_URL=$(get_output MyMedicineSummaryUrl)"        >> $GITHUB_OUTPUT
          echo "RETURN_URL=$(get_output MyReturnPlanUrl)"              >> $GITHUB_OUTPUT
          echo "CHAT_URL=$(get_output SmartMedHelpUrl)"                >> $GITHUB_OUTPUT
          echo "BUCKET=$(get_output BucketName)"                       >> $GITHUB_OUTPUT

      # ── 8. Inject Lambda URLs into frontend ──────────────
      - name: Inject Lambda URLs into index.html
        run: |
          cp frontend/index.html frontend/index.html.bak

          sed -i "s|__URL_EXTRACT_FROM_PHOTO__|${{ steps.outputs.outputs.EXTRACT_URL }}|g"   frontend/index.html
          sed -i "s|__URL_MEDICINE_CARD__|${{ steps.outputs.outputs.MEDICINE_CARD_URL }}|g"  frontend/index.html
          sed -i "s|__URL_MY_MEDICINE_SUMMARY__|${{ steps.outputs.outputs.SUMMARY_URL }}|g"  frontend/index.html
          sed -i "s|__URL_MY_RETURN_PLAN__|${{ steps.outputs.outputs.RETURN_URL }}|g"        frontend/index.html
          sed -i "s|__URL_SMARTMED_HELP__|${{ steps.outputs.outputs.CHAT_URL }}|g"           frontend/index.html

          echo "✅ URLs injected:"
          grep -o "https://[^'\"]*lambda-url[^'\"]*" frontend/index.html | head -10 || true

      # ── 9. Sync frontend to S3 ───────────────────────────
      - name: Sync frontend to S3
        run: |
          aws s3 sync frontend/ s3://${{ steps.outputs.outputs.BUCKET }}/ \
            --cache-control no-cache \
            --delete \
            --region ap-southeast-1

          echo "✅ Frontend deployed to S3"

      # ── 10. Print website URL ────────────────────────────
      - name: Print website URL
        run: |
          WEBSITE=$(aws cloudformation describe-stacks \
            --stack-name smartmed-cycle \
            --region ap-southeast-5 \
            --query "Stacks[0].Outputs[?OutputKey=='WebsiteUrl'].OutputValue" \
            --output text)
          echo "🌐 SmartMed Cycle is live at: $WEBSITE"
