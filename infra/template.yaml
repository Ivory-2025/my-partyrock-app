AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SmartMed Cycle — Lambda backends + S3 frontend

Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 512
    Environment:
      Variables:
        AWS_REGION_NAME: ap-southeast-5

Resources:

  AppBedrockRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SmartMedCycleBedrockRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockInvokePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: "*"

  ExtractfromPhotoFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: smartmed-extract-from-photo
      CodeUri: ../lambdas/extract_from_photo/
      Handler: app.app
      Role: !GetAtt AppBedrockRole.Arn
      FunctionUrlConfig:
        AuthType: NONE

  MedicineCardFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: smartmed-medicine-card
      CodeUri: ../lambdas/medicine_card/
      Handler: app.app
      Role: !GetAtt AppBedrockRole.Arn
      FunctionUrlConfig:
        AuthType: NONE

  MyMedicineSummaryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: smartmed-my-medicine-summary
      CodeUri: ../lambdas/my_medicine_summary/
      Handler: app.app
      Role: !GetAtt AppBedrockRole.Arn
      FunctionUrlConfig:
        AuthType: NONE

  MyReturnPlanFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: smartmed-my-return-plan
      CodeUri: ../lambdas/my_return_plan/
      Handler: app.app
      Role: !GetAtt AppBedrockRole.Arn
      FunctionUrlConfig:
        AuthType: NONE

  SmartMedHelpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: smartmed-help
      CodeUri: ../lambdas/smartmed_help/
      Handler: app.app
      Role: !GetAtt AppBedrockRole.Arn
      FunctionUrlConfig:
        AuthType: NONE

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "smartmed-cycle-frontend-${AWS::AccountId}"
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${FrontendBucket}/*"

Outputs:

  ExtractfromPhotoUrl:
    Value: !GetAtt ExtractfromPhotoFunctionUrl.FunctionUrl

  MedicineCardUrl:
    Value: !GetAtt MedicineCardFunctionUrl.FunctionUrl

  MyMedicineSummaryUrl:
    Value: !GetAtt MyMedicineSummaryFunctionUrl.FunctionUrl

  MyReturnPlanUrl:
    Value: !GetAtt MyReturnPlanFunctionUrl.FunctionUrl

  SmartMedHelpUrl:
    Value: !GetAtt SmartMedHelpFunctionUrl.FunctionUrl

  WebsiteUrl:
    Value: !GetAtt FrontendBucket.WebsiteURL

  BucketName:
    Value: !Ref FrontendBucket
