AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SmartMed Cycle — Lambda backends + S3 frontend

# ── Globals ─────────────────────────────────────────────────
Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 512
    Environment:
      Variables:
        AWS_REGION_NAME: ap-southeast-5

# ── Resources ────────────────────────────────────────────────
Resources:

  # IAM Role
  AppBedrockRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SmartMedCycleBedrockRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockInvokePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: "*"

  # ── Lambda: Extract from Photo ───────────────────────────
  ExtractfromPhotoFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: smartmed-extract-from-photo
      CodeUri: ../lambdas/extract_from_photo/
      Handler: app.app
      Role: !GetAtt AppBedrockRole.Arn

  ExtractfromPhotoUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ExtractfromPhotoFunction.Arn
      AuthType: NONE
      Cors:
        AllowOrigins: ["*"]
        AllowMethods: ["POST", "OPTIONS"]
        AllowHeaders: ["Content-Type"]

  ExtractfromPhotoUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ExtractfromPhotoFunction.Arn
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  # ── Lambda: Medicine Card ────────────────────────────────
  MedicineCardFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: smartmed-medicine-card
      CodeUri: ../lambdas/medicine_card/
      Handler: app.app
      Role: !GetAtt AppBedrockRole.Arn

  MedicineCardUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt MedicineCardFunction.Arn
      AuthType: NONE
      Cors:
        AllowOrigins: ["*"]
        AllowMethods: ["POST", "OPTIONS"]
        AllowHeaders: ["Content-Type"]

  MedicineCardUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt MedicineCardFunction.Arn
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  # ── Lambda: My Medicine Summary ──────────────────────────
  MyMedicineSummaryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: smartmed-my-medicine-summary
      CodeUri: ../lambdas/my_medicine_summary/
      Handler: app.app
      Role: !GetAtt AppBedrockRole.Arn

  MyMedicineSummaryUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt MyMedicineSummaryFunction.Arn
      AuthType: NONE
      Cors:
        AllowOrigins: ["*"]
        AllowMethods: ["POST", "OPTIONS"]
        AllowHeaders: ["Content-Type"]

  MyMedicineSummaryUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt MyMedicineSummaryFunction.Arn
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  # ── Lambda: My Return Plan ───────────────────────────────
  MyReturnPlanFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: smartmed-my-return-plan
      CodeUri: ../lambdas/my_return_plan/
      Handler: app.app
      Role: !GetAtt AppBedrockRole.Arn

  MyReturnPlanUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt MyReturnPlanFunction.Arn
      AuthType: NONE
      Cors:
        AllowOrigins: ["*"]
        AllowMethods: ["POST", "OPTIONS"]
        AllowHeaders: ["Content-Type"]

  MyReturnPlanUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt MyReturnPlanFunction.Arn
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  # ── Lambda: SmartMed Help ────────────────────────────────
  SmartMedHelpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: smartmed-help
      CodeUri: ../lambdas/smartmed_help/
      Handler: app.app
      Role: !GetAtt AppBedrockRole.Arn

  SmartMedHelpUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt SmartMedHelpFunction.Arn
      AuthType: NONE
      Cors:
        AllowOrigins: ["*"]
        AllowMethods: ["POST", "OPTIONS"]
        AllowHeaders: ["Content-Type"]

  SmartMedHelpUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt SmartMedHelpFunction.Arn
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  # ── S3 Frontend Bucket ───────────────────────────────────
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "smartmed-cycle-frontend-${AWS::AccountId}"
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${FrontendBucket}/*"

# ── Outputs ──────────────────────────────────────────────────
Outputs:

  ExtractfromPhotoUrl:
    Description: URL for Extract from Photo Lambda
    Value: !GetAtt ExtractfromPhotoUrl.FunctionUrl

  MedicineCardUrl:
    Description: URL for Medicine Card Lambda
    Value: !GetAtt MedicineCardUrl.FunctionUrl

  MyMedicineSummaryUrl:
    Description: URL for My Medicine Summary Lambda
    Value: !GetAtt MyMedicineSummaryUrl.FunctionUrl

  MyReturnPlanUrl:
    Description: URL for My Return Plan Lambda
    Value: !GetAtt MyReturnPlanUrl.FunctionUrl

  SmartMedHelpUrl:
    Description: URL for SmartMed Help Lambda
    Value: !GetAtt SmartMedHelpUrl.FunctionUrl

  WebsiteUrl:
    Description: S3 static website URL
    Value: !GetAtt FrontendBucket.WebsiteURL

  BucketName:
    Description: S3 bucket name for frontend sync
    Value: !Ref FrontendBucket
